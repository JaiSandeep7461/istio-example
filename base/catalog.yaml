apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-v1
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
      version: v1
  template:
    metadata:
      labels:
        app: catalog
        version: v1
    spec:
      containers:
        - name: catalog
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:5678", "-text=catalog response from v1"]
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-v2
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
      version: v2
  template:
    metadata:
      labels:
        app: catalog
        version: v2
    spec:
      containers:
        - name: catalog
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:5678", "-text=catalog response from v2"]
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: shop
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 5678
      targetPort: 5678
      protocol: TCP
