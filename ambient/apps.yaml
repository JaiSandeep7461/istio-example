apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ambient-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: curlimages/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                sleep 3600
              done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ambient-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:5678", "-text=ambient catalog response"]
          ports:
            - name: http
              containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: ambient-shop
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 5678
      targetPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ambient-shop
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
