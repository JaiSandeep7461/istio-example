apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reviews-resilience
  namespace: shop
spec:
  hosts:
    - reviews
  http:
    - fault:
        delay:
          percentage:
            value: 30
          fixedDelay: 3s
      timeout: 2s
      retries:
        attempts: 2
        perTryTimeout: 1s
      route:
        - destination:
            host: reviews
