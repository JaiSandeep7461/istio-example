apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: shop-gateway
  namespace: shop
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - shop.local
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: shop-ingress
  namespace: shop
spec:
  hosts:
    - shop.local
  gateways:
    - shop-gateway
  http:
    - route:
        - destination:
            host: frontend
            port:
              number: 8080
